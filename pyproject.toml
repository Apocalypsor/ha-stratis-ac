[project]
name = "ha-stratis-ac"
version = "0.1.0"
description = "Unofficial STRATIS thermostat integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "ruff>=0.16.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
